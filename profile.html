<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Profile</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        header {
            background: #123c88;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        header p {
            margin-top: 10px;
        }

        .profile-card {
            max-width: 750px;
            margin: 50px auto;
            padding: 40px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
            text-align: center;
        }

        .profile-card img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 50%;
            border: 6px solid #123c88;
            margin-bottom: 20px;
        }

        .profile-card h2 {
            font-size: 34px;
            color: #123c88;
            margin: 10px 0 25px;
        }

        .profile-info {
            background: #f4f7fb;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
        }

        .profile-info p {
            margin: 10px 0;
            color: #444;
        }

        .profile-section {
            text-align: left;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        .profile-section h3 {
            color: #123c88;
            font-size: 22px;
        }

        .profile-section p {
            color: #555;
            line-height: 1.8;
        }

        .back-button {
            display: block;
            width: fit-content;
            margin: 20px auto 40px;
            padding: 12px 25px;
            background: #123c88;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        .back-button:hover {
            background: #0b2d68;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 28px;
            }

            .profile-card {
                width: 80%;
                margin: 30px auto;
                padding: 25px;
            }

            .profile-card img {
                width: 170px;
                height: 170px;
            }

            .profile-card h2 {
                font-size: 28px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        St. Michael Old Students
    </h1>

    <p>
        Student Profile
    </p>

</header>


<main>

    <div id="profile">

        <div class="profile-card">

            <h2>
                Loading...
            </h2>

            <p>
                Loading student information...
            </p>

        </div>

    </div>


    <a
        href="index.html"
        class="back-button"
    >
        ← Back to Old Students
    </a>

</main>

// =========================
// LOAD PROFILE
// =========================

async function loadProfile() {

    if (!studentId) {

        showNotFound();

        return;
    }


    // -------------------------
    // 1. STATIC STUDENT
    // -------------------------

    if (staticStudents[studentId]) {

        showProfile(
            staticStudents[studentId]
        );

        return;
    }


    // -------------------------
    // 2. SUPABASE STUDENT
    // -------------------------

    try {

        const { data, error } =
            await supabaseClient
                .from("students")
                .select("*")
                .eq("id", studentId)
                .maybeSingle();


        if (error) {

            console.error(
                "Supabase error:",
                error
            );

            showNotFound();

            return;
        }


        if (data) {

            showProfile(data);

            return;
        }


        showNotFound();


    } catch (error) {

        console.error(
            "Profile error:",
            error
        );

        showNotFound();
    }

}


// =========================
// SHOW PROFILE
// =========================

function showProfile(student) {

    profile.innerHTML = `

        <div class="profile-card">

            <img
                src="${student.photo || "photos/student3.jpg"}"
                alt="${student.name || "Student"}"
            >


            <h2>
                ${student.name || ""}
            </h2>


            <div class="profile-info">

                <p>

                    <strong>
                        Graduation Year:
                    </strong>

                    ${student.graduation || ""}

                </p>


                <p>

                    <strong>
                        School:
                    </strong>

                    ${student.school || "St. Michael School"}

                </p>

            </div>


            <div class="profile-section">

                <h3>
                    About
                </h3>

                <p>
                    ${student.about || "No information available."}
                </p>

            </div>


            <div class="profile-section">

                <h3>

                </h3>

                <p>
                    ${student.memories || "No memories added yet."}
                </p>

            </div>


            <div class="profile-section">

                <h3>
                    Message
                </h3>

                    ${student.message || "No message added yet."}
                </p>

            </div>

        </div>

    `;

}
